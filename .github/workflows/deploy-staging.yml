# Staging deploy — push/merge to develop
# Primary API host: Render (see docs/RENDER_DEPLOY.md + render.yaml).
# Vercel auto-deploys develop for the web app.
# Railway CLI below is optional / legacy if RAILWAY_TOKEN is set.

name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @greenkey/api exec prisma generate
      - run: pnpm --filter @greenkey/api build

  railway-api:
    name: Railway API (staging)
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy API to Railway staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skip CLI deploy."
            echo "Use Railway GitHub integration (branch develop → staging) instead."
            exit 0
          fi
          railway up --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --detach

  vercel-note:
    name: Vercel (staging)
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Confirm Vercel Git deploy
        run: |
          echo "Configure Vercel Project → Settings → Git:"
          echo "  Production Branch: main"
          echo "  Staging / branch develop → domain staging.yourdomain.com"
          echo "Optional: set secrets VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID"
          echo "and uncomment a vercel --prod=false deploy step."
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            npm install -g vercel
            vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
            vercel deploy --prebuilt=false --token="${{ secrets.VERCEL_TOKEN }}"
          else
            echo "No VERCEL_TOKEN — relying on Vercel auto-deploy from GitHub."
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
